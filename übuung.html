<!DOCTYPE html>
<head>
    <title>Übung</title>
    <style>

   body {
        background: #0A0A0A;
        color: #F5f5f0;
font-family:sans-serif;
padding: 40px;
    }
h2 {
    color: #FF0090;
    font-size: 48px;
}
p {
    color: #888;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;

}
.card {
    background: #1A1A1A;
    padding: 32px;
    border-top: 2px solid #FF0090;
    max-width: 300px;

}
.btn {
    background: #FF0090;
    color: #0A0A0A;
    border: none;
    padding: 14px 28px;
    font-size: 15px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 20px;
}
.btn:hover {
    opacity: 0.8;
    cursor: pointer;
}

/* pixel art dragon */
.dragon {
    position: fixed;
    bottom: 24px;
    right: 32px;
    image-rendering: pixelated;
    width: 80px;
    height: 80px;
    cursor: pointer;
    animation: dragonBob 2s ease-in-out infinite;
}
.dragon:hover {
    animation: dragonWiggle 0.4s ease-in-out infinite;
}
@keyframes dragonBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
}
@keyframes dragonWiggle {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
}
</style>
</head>
<body>
    Hallo
    <div class="card">
    <h2>Kata</h2>
<p>Co-Founder·HNL</p>
<p>Ich baue gerade meine erste Website von Scratch.</p>
<button class="btn">Apply Now</button>
</div>

<!-- pixel art dragon in the corner -->
<svg class="dragon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" title="tiny pink dragon 🐉">
  <!-- tail -->
  <rect x="1" y="11" width="1" height="1" fill="#ff69b4"/>
  <rect x="2" y="10" width="1" height="1" fill="#ff69b4"/>
  <rect x="1" y="9" width="1" height="1" fill="#ff69b4"/>
  <rect x="2" y="8" width="1" height="1" fill="#ff69b4"/>
  <!-- body -->
  <rect x="3" y="7" width="5" height="5" fill="#ff69b4"/>
  <rect x="4" y="6" width="4" height="2" fill="#ff69b4"/>
  <!-- belly -->
  <rect x="4" y="9" width="3" height="2" fill="#ffb6d9"/>
  <!-- neck -->
  <rect x="6" y="5" width="2" height="3" fill="#ff69b4"/>
  <!-- head -->
  <rect x="5" y="2" width="5" height="4" fill="#ff69b4"/>
  <!-- snout -->
  <rect x="9" y="4" width="2" height="2" fill="#ff85c2"/>
  <rect x="11" y="5" width="1" height="1" fill="#ff85c2"/>
  <!-- nostril -->
  <rect x="10" y="4" width="1" height="1" fill="#ff1493"/>
  <!-- eye -->
  <rect x="6" y="3" width="1" height="1" fill="#fff"/>
  <rect x="6" y="3" width="1" height="1" fill="#222"/>
  <!-- pupil shine -->
  <rect x="6" y="3" width="1" height="1" fill="#ff1493"/>
  <rect x="7" y="3" width="1" height="1" fill="#222"/>
  <!-- horns -->
  <rect x="6" y="1" width="1" height="2" fill="#ff1493"/>
  <rect x="8" y="0" width="1" height="2" fill="#ff1493"/>
  <!-- wings -->
  <rect x="3" y="5" width="1" height="3" fill="#ff85c2"/>
  <rect x="2" y="4" width="1" height="3" fill="#ff85c2"/>
  <rect x="1" y="4" width="1" height="2" fill="#ffb6d9"/>
  <!-- legs -->
  <rect x="4" y="12" width="1" height="2" fill="#ff69b4"/>
  <rect x="3" y="13" width="2" height="1" fill="#ff1493"/>
  <rect x="6" y="12" width="1" height="2" fill="#ff69b4"/>
  <rect x="6" y="13" width="2" height="1" fill="#ff1493"/>
  <!-- fire breath -->
  <rect x="12" y="4" width="1" height="1" fill="#ff6600" opacity="0.9"/>
  <rect x="13" y="3" width="1" height="2" fill="#ffaa00" opacity="0.8"/>
  <rect x="14" y="3" width="1" height="1" fill="#ffdd00" opacity="0.7"/>
  <rect x="14" y="5" width="1" height="1" fill="#ff6600" opacity="0.6"/>
  <rect x="15" y="4" width="1" height="1" fill="#ffdd00" opacity="0.5"/>
</svg>
<svg width="80" height="80" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
 <rect x="3" y="8" width="8" height="4" fill="blue"/>
 <!-- kopf -->

</svg>

</body>
</html>
