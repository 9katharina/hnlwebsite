<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz — Her Next Level</title>
<meta name="description" content="Fünf Fragen. Ehrlich beantwortet. Dann weißt du, ob ATHENA gerade das Richtige für dich ist.">
<link rel="stylesheet" href="assets/css/base.css">
<style>
  .quiz-wrap { max-width: 640px; margin: 0 auto; padding: 100px 40px 120px; min-height: 80svh; display:flex; flex-direction:column; justify-content:center; }

  .quiz-progress { display:flex; gap:6px; margin-bottom: 44px; }
  .quiz-progress span { height:2px; flex:1; background: var(--grey-mid); }
  .quiz-progress span.done { background: var(--pink); }

  .quiz-eyebrow { font-family:'DM Mono', monospace; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--grey); margin-bottom:20px; }
  .quiz-question { font-family:'Bebas Neue', sans-serif; font-size: clamp(30px, 5vw, 46px); line-height:1.05; margin-bottom:40px; }

  .quiz-options { display:flex; flex-direction:column; gap:14px; }
  .quiz-option {
    text-align:left; background: rgba(26,26,26,0.5); border: 1px solid var(--grey-mid); color: var(--white);
    font-family:'DM Sans', sans-serif; font-size:15px; font-weight:300; line-height:1.5;
    padding: 20px 24px; cursor:pointer; transition: border-color .2s, background .2s;
  }
  .quiz-option:hover { border-color: var(--pink); background: rgba(255,0,144,0.06); }

  .quiz-back {
    margin-top: 36px; font-family:'DM Mono', monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color: var(--grey); background:none; border:none; cursor:pointer; padding:0; text-align:left; transition: color .2s;
  }
  .quiz-back:hover { color: var(--white); }
  .quiz-back:disabled { visibility: hidden; }

  .quiz-result-tag { font-family:'DM Mono', monospace; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--pink); margin-bottom:20px; }
  .quiz-result-title { font-family:'Bebas Neue', sans-serif; font-size: clamp(40px, 7vw, 68px); line-height:0.98; margin-bottom:28px; }
  .quiz-result-title .pink { color: var(--pink); }
  .quiz-result-desc { font-size:15px; line-height:1.85; color:var(--grey); max-width:520px; margin-bottom:40px; }
  .quiz-result-desc strong { color: var(--white); font-weight:400; }
  .quiz-restart {
    margin-top: 20px; font-family:'DM Mono', monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
    color: var(--grey); background:none; border:none; cursor:pointer; padding:0; transition: color .2s;
  }
  .quiz-restart:hover { color: var(--white); }

  @media (max-width: 640px) {
    .quiz-wrap { padding: 80px 24px 100px; }
  }
</style>
</head>
<body>

<div class="bg-ambient" aria-hidden="true">
  <div class="blob blob--wine"></div>
  <div class="blob blob--pink"></div>
  <div class="blob blob--gold"></div>
  <div class="cursor-glow"></div>
</div>
<div class="bg-grid" aria-hidden="true"></div>

<nav class="site-nav">
  <a href="index.html" class="nav-logo">HNL<span>.</span></a>
  <div class="nav-links">
    <a href="index.html">Startseite</a>
    <a href="ueber-uns.html">Über uns</a>
    <a href="hnl_apply.html" class="nav-cta">Bewerben</a>
  </div>
</nav>

<div class="quiz-wrap">
  <div class="quiz-progress" id="quizProgress"></div>
  <div id="quizStage"></div>
</div>

<footer class="site-footer">
  <a href="index.html" class="footer-logo">HNL<span>.</span></a>
  <div class="footer-links">
    <a href="ueber-uns.html">Über uns</a>
    <a href="hnl_apply.html">Bewerben</a>
    <a href="mailto:hello@hernextlvl.com">Kontakt</a>
    <a href="hnl_privacy.html">Datenschutz</a>
  </div>
  <div class="footer-copy">© 2026 Her Next Level</div>
</footer>

<script src="assets/js/ambient.js"></script>
<script>
  const questions = [
    {
      eyebrow: "Frage 1 von 5",
      text: "Wie weit bist du mit deiner Idee?",
      options: [
        { label: 'Ich weiß nur, dass ich „etwas Eigenes" will.', points: 0 },
        { label: "Ich hab eine Richtung, aber noch nichts Konkretes gebaut.", points: 1 },
        { label: "Ich hab schon was gestartet, aber es stockt.", points: 2 },
      ],
    },
    {
      eyebrow: "Frage 2 von 5",
      text: "Was hält dich gerade am meisten zurück?",
      options: [
        { label: "Ich weiß nicht, wo ich anfangen soll.", points: 0 },
        { label: "Angst vor dem ersten ernsthaften Schritt.", points: 1 },
        { label: "Mir fehlt die Struktur, um dranzubleiben.", points: 2 },
      ],
    },
    {
      eyebrow: "Frage 3 von 5",
      text: 'Wie oft hast du in den letzten 3 Monaten gesagt: „bald fang ich an"?',
      options: [
        { label: "Eigentlich nie — ich hab noch nicht mal angefangen, drüber nachzudenken.", points: 0 },
        { label: "Ein paar Mal.", points: 1 },
        { label: "Das ist quasi mein Standardsatz.", points: 2 },
      ],
    },
    {
      eyebrow: "Frage 4 von 5",
      text: "Du stehst in 90 Tagen exakt da, wo du heute stehst. Wie fühlt sich das an?",
      options: [
        { label: "Ehrlich, darüber hab ich noch nicht nachgedacht.", points: 0 },
        { label: "Unangenehm, aber ich komm klar.", points: 1 },
        { label: "Unerträglich. Das darf nicht passieren.", points: 2 },
      ],
    },
    {
      eyebrow: "Frage 5 von 5",
      text: "Bereit, dich vor eine Kamera zu stellen und ehrlich zu sein — keine Politur, kein Skript?",
      options: [
        { label: "Eher nicht.", points: 0 },
        { label: "Würde mich überwinden müssen, aber ja.", points: 1 },
        { label: "Ja, sofort.", points: 2 },
      ],
    },
  ];

  const results = [
    {
      min: 8,
      tag: "Ergebnis",
      title: "Du bist <span class=\"pink\">bereit.</span>",
      desc: "Du hast Richtung, du spürst den Druck, und du bist bereit, ehrlich vor die Kamera zu treten. Das ist mehr, als die meisten je zugeben. Es gibt keinen Grund mehr zu warten.",
      cta: "Jetzt bewerben",
    },
    {
      min: 4,
      tag: "Ergebnis",
      title: "Du redest dir noch was <span class=\"pink\">ein.</span>",
      desc: "Etwas hält dich noch zurück — Angst, fehlende Struktur, eine Ausrede, die sich vernünftig anfühlt. Genau dafür gibt es ATHENA. Nicht für Frauen, die schon alles allein hinbekommen.",
      cta: "Bewirb dich trotzdem",
    },
    {
      min: 0,
      tag: "Ergebnis",
      title: "Ehrlich? Noch <span class=\"pink\">nicht ganz.</span>",
      desc: "Du hast noch keine klare Richtung — und das ist okay, aber ATHENA ist für Frauen, die schon wissen, was sie bauen wollen, und nur noch die Struktur brauchen. Nimm dir die Zeit, das zu klären. Wenn du bereit bist, es trotzdem herauszufinden, ist die Bewerbung offen.",
      cta: "Bewerbung ansehen",
    },
  ];

  let current = 0;
  let score = 0;
  const stage = document.getElementById('quizStage');
  const progressEl = document.getElementById('quizProgress');

  function renderProgress() {
    progressEl.innerHTML = questions.map((_, i) =>
      `<span class="${i < current ? 'done' : ''}"></span>`
    ).join('');
  }

  function renderQuestion() {
    renderProgress();
    const q = questions[current];
    stage.innerHTML = `
      <p class="quiz-eyebrow">${q.eyebrow}</p>
      <h1 class="quiz-question">${q.text}</h1>
      <div class="quiz-options">
        ${q.options.map((opt, i) => `<button class="quiz-option" data-points="${opt.points}">${opt.label}</button>`).join('')}
      </div>
      <button class="quiz-back" ${current === 0 ? 'disabled' : ''}>← Zurück</button>
    `;
    stage.querySelectorAll('.quiz-option').forEach(btn => {
      btn.addEventListener('click', () => {
        score += parseInt(btn.dataset.points, 10);
        current++;
        if (current < questions.length) {
          renderQuestion();
        } else {
          renderResult();
        }
      });
    });
    const backBtn = stage.querySelector('.quiz-back');
    backBtn.addEventListener('click', () => {
      if (current > 0) { current--; renderQuestion(); }
    });
  }

  function renderResult() {
    progressEl.innerHTML = questions.map(() => `<span class="done"></span>`).join('');
    const result = results.find(r => score >= r.min);
    stage.innerHTML = `
      <p class="quiz-result-tag">${result.tag}</p>
      <h1 class="quiz-result-title">${result.title}</h1>
      <p class="quiz-result-desc">${result.desc}</p>
      <a href="hnl_apply.html" class="btn-primary">${result.cta}</a>
      <br>
      <button class="quiz-restart">Quiz nochmal machen</button>
    `;
    stage.querySelector('.quiz-restart').addEventListener('click', () => {
      current = 0; score = 0; renderQuestion();
    });
  }

  renderQuestion();
</script>
</body>
</html>
